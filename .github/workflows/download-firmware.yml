name: Download Q2 firmware

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  download-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest available firmware
        id: firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QIDI_DEVICE_ID: ${{ secrets.QIDI_DEVICE_ID }}
        run: |
          set -euo pipefail

          if [[ -z "${QIDI_DEVICE_ID:-}" ]]; then
            echo "Repository secret QIDI_DEVICE_ID is required." >&2
            exit 1
          fi

          DEVICE_ID=$(printf '%s' "$QIDI_DEVICE_ID" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          if [[ ! "$DEVICE_ID" =~ ^[0-9A-F]+$ ]]; then
            echo "QIDI_DEVICE_ID must be the hexadecimal CPU serial from /proc/cpuinfo." >&2
            exit 1
          fi

          # The API only answers for a plausible currentVersion, so report the
          # newest release already mirrored here.
          CURRENT_VERSION=$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            sed -n 's/^V\([0-9][0-9]*\(\.[0-9][0-9]*\)*\)$/\1/p' |
            sort -V | tail -n 1)
          CURRENT_VERSION=${CURRENT_VERSION:-01.01.02.04}
          echo "Requesting update from version $CURRENT_VERSION"

          # Update request signing reverse-engineered by @thelegendtubaguy:
          # https://github.com/thelegendtubaguy/QidiMax4CommunityWiki/blob/main/docs/qidi_client_firmware_update_flow.md
          # X-Version is the client API profile, not the firmware version.
          TIMESTAMP=$(date +%s%3N)
          NONCE=$(openssl rand -hex 16)
          SIGNATURE=$(printf '%s' 'qidi3d null' |
            openssl dgst -sha256 -hmac 'qid3d-from-2025-CAFE-BABE' |
            sed 's/^.* //')

          RESPONSE_FILE=$(mktemp)
          HTTP_STATUS=$(curl --silent --show-error --get \
            --output "$RESPONSE_FILE" --write-out '%{http_code}' \
            'https://api.qidimaker.com/backend/v1/fireware/upgrade-info' \
            --data-urlencode 'hardware=QD_Q2' \
            --data-urlencode "currentVersion=$CURRENT_VERSION" \
            --data-urlencode "deviceId=$DEVICE_ID" \
            -H 'User-Agent: xindi/4.4.23' \
            -H 'Accept: */*' \
            -H 'Accept-Language: en_US' \
            -H 'Content-Type: application/json' \
            -H "X-DeviceId: $DEVICE_ID" \
            -H 'X-DeviceType: Q2' \
            -H "X-Nonce: $NONCE" \
            -H 'X-Platform: 3DPrinter' \
            -H 'X-Region: NA' \
            -H "X-Signature: $SIGNATURE" \
            -H "X-Timestamp: $TIMESTAMP" \
            -H 'X-Timezone: +00:00' \
            -H 'X-Version: 01.01')
          RESPONSE=$(cat "$RESPONSE_FILE")

          if [[ "$HTTP_STATUS" != 200 ]] || ! jq -e '.code == 200' <<<"$RESPONSE" >/dev/null 2>&1; then
            echo "Update API request failed with HTTP $HTTP_STATUS:" >&2
            jq . <<<"$RESPONSE" >&2 2>/dev/null || printf '%s\n' "$RESPONSE" >&2
            exit 1
          fi

          if ! jq -e '.data.needUpdate != false and .data.version and .data.url' <<<"$RESPONSE" >/dev/null; then
            echo "No firmware newer than $CURRENT_VERSION is available."
            jq -c . <<<"$RESPONSE"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(jq -r '.data.version | ltrimstr("V")' <<<"$RESPONSE")
          DOWNLOAD_URL=$(jq -r '.data.url' <<<"$RESPONSE")
          # The API currently returns a placeholder URL here, so only keep real text.
          DESCRIPTION=$(jq -r '.data.description // "" | select(test("^\\s*https?://") | not)' <<<"$RESPONSE")
          DESCRIPTION=${DESCRIPTION:-Firmware update for QIDI Q2}
          {
            echo "available=true"
            echo "version=$VERSION"
            echo "tag=V$VERSION"
            echo "download_url=$DOWNLOAD_URL"
            echo "description<<__EOF__"
            echo "$DESCRIPTION"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        if: steps.firmware.outputs.available == 'true'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.firmware.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG does not exist"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download and validate firmware
        if: steps.release.outputs.exists == 'false'
        id: bundle
        env:
          DOWNLOAD_URL: ${{ steps.firmware.outputs.download_url }}
          API_VERSION: ${{ steps.firmware.outputs.version }}
        run: |
          set -euo pipefail

          curl --fail --location --silent --show-error "$DOWNLOAD_URL" -o firmware.zip
          unzip -tq firmware.zip
          unzip -p firmware.zip firmware_manifest.json > firmware-manifest.tmp
          mv firmware-manifest.tmp firmware_manifest.json

          SOC_VERSION=$(jq -er '.SOC.version' firmware_manifest.json)
          if [[ "$SOC_VERSION" != "$API_VERSION" ]]; then
            echo "API version $API_VERSION does not match manifest SOC version $SOC_VERSION." >&2
            exit 1
          fi

          ARCHIVE_FILES=$(unzip -Z1 firmware.zip)
          MANIFEST_FILES=$(jq -er 'to_entries[] | select(.value | type == "object")
            | .value.file // error("manifest component \(.key) has no file")' firmware_manifest.json)
          while IFS= read -r component_file; do
            if ! grep -Fqx "$component_file" <<<"$ARCHIVE_FILES"; then
              echo "Firmware bundle is missing manifest file $component_file." >&2
              exit 1
            fi
          done <<<"$MANIFEST_FILES"

          {
            echo "components<<__EOF__"
            jq -er 'to_entries[] | select(.value | type == "object")
              | "| \(.key) | \(.value.version // "unknown") |"' firmware_manifest.json
            echo "__EOF__"
            echo "sha256=$(sha256sum firmware.zip | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        if: steps.release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.firmware.outputs.tag }}
          name: Firmware ${{ steps.firmware.outputs.tag }}
          body: |
            ${{ steps.firmware.outputs.description }}

            | Component | Version |
            | --- | --- |
            ${{ steps.bundle.outputs.components }}

            Source: ${{ steps.firmware.outputs.download_url }}

            Release notes: https://wiki.qidi3d.com/en/Q2/firmware-release-history

            SHA-256: `${{ steps.bundle.outputs.sha256 }}`

            ---

            **Note:** The firmware.zip file is the property of QIDI Tech. Copyright © 2025 QIDI Tech All Rights Reserved.

            This repository only automates the distribution of official firmware releases.
          files: firmware.zip
          draft: false
          prerelease: false
